<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Transport - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eef5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 900px;
            min-height: 520px;
            background: white;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        /* LEFT PANEL */

        .left-panel {
            width: 50%;
            background: linear-gradient(145deg, #087f8c, #075b63);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .bus-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .left-panel h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .left-panel p {
            font-size: 15px;
            line-height: 1.7;
            opacity: 0.9;
        }

        /* RIGHT PANEL */

        .right-panel {
            width: 50%;
            padding: 55px 50px;
        }

        .right-panel h2 {
            color: #164e63;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .welcome {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus,
        .input-box select:focus {
            border-color: #087f8c;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #087f8c;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #087f8c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #075b63;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .signup a {
            color: #087f8c;
            font-weight: bold;
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .login-box {
                width: 92%;
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .left-panel {
                padding: 30px;
            }

            .left-panel h1 {
                font-size: 25px;
            }

            .bus-icon {
                font-size: 55px;
            }

            .right-panel {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- LEFT SIDE -->

        <div class="left-panel">

            <div class="bus-icon">🚌</div>

            <h1>University Transport</h1>

            <p>
                University Bus Transport Management System
            </p>

            <p>
                Safe, Smart & Reliable Transportation
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right-panel">

            <h2>Welcome Back!</h2>

            <p class="welcome">
                Please login to access your account.
            </p>


            <form>

                <div class="input-box">

                    <label>Login As</label>

                    <select required>

                        <option value="">Select Role</option>

                        <option>Student / Passenger</option>

                        <option>Driver</option>

                        <option>Conductor</option>

                        <option>Transport Manager</option>

                        <option>Admin</option>

                    </select>

                </div>


                <div class="input-box">

                    <label>Email / User ID</label>

                    <input
                        type="text"
                        placeholder="Enter your email or User ID"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                </div>


                <button class="login-btn" type="submit">
                    Login
                </button>


                <div class="signup">

                    Don't have an account?

                    <a href="#">
                        Register
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
